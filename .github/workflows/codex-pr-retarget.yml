name: Codex PR Retarget

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  retarget-codex-task-pr:
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.event.pull_request.head.ref, 'codex/') &&
      contains(github.event.pull_request.body || '', 'Task-ID:') &&
      contains(github.event.pull_request.body || '', 'Task-Issue:')
    steps:
      - name: Retarget from main to develop when needed
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.base.ref === 'main') {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                base: 'develop',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: 'Codex task PR retargeted from main to develop.',
              });

              core.info(`PR #${pr.number} retargeted from main to develop.`);
              return;
            }

            if (pr.base.ref === 'develop') {
              core.info(`PR #${pr.number} already targets develop. No action taken.`);
              return;
            }

            core.info(
              `PR #${pr.number} targets '${pr.base.ref}', which is outside this workflow scope. No action taken.`
            );
