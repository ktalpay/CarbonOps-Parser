name: "Ready Task Dispatch Discovery"

"on":
  workflow_dispatch:
    inputs:
      claim:
        description: "Claim the selected ready task by running --run-once-claim"
        required: false
        default: false
        type: boolean
      start_codex_cloud:
        description: "After a successful claim, start Codex Cloud by posting the generated handoff prompt with @codex"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  run-once-discovery:
    name: "Run ready-task dispatch discovery"
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Run dispatcher report"
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CLAIM_MODE: ${{ inputs.claim }}
          START_CODEX_CLOUD: ${{ inputs.start_codex_cloud }}
        run: |
          set -euo pipefail

          REPORT_DIR="ready-dispatch-report"
          REPORT_PATH="$REPORT_DIR/run-once-report.md"
          HANDOFF_ARTIFACT_DIR=".agent-handoff"
          mkdir -p "$REPORT_DIR"

          REPORT_ARGS=(
            --repo "$REPOSITORY"
            --run-once
            --artifact-dir "$HANDOFF_ARTIFACT_DIR"
          )
          MODE_DESCRIPTION="read-only --run-once"
          CLAIM_ENABLED="false"

          if [ "$CLAIM_MODE" = "true" ]; then
            REPORT_ARGS+=(--run-once-claim)
            MODE_DESCRIPTION="claim --run-once --run-once-claim"
            CLAIM_ENABLED="true"
          fi

          set +e
          python scripts/agent_dispatch_handoff_reporter.py "${REPORT_ARGS[@]}" > "$REPORT_PATH"
          REPORT_EXIT_CODE="$?"
          set -e

          HANDOFF_PROMPTS_FOUND="false"
          HANDOFF_PROMPTS_PACKAGED="false"
          HANDOFF_PROMPT_COUNT="0"
          HANDOFF_PROMPT_PATH=""
          if compgen -G "$HANDOFF_ARTIFACT_DIR/*-prompt.md" > /dev/null; then
            HANDOFF_PROMPTS_FOUND="true"
            mapfile -t HANDOFF_PROMPT_PATHS < <(find "$HANDOFF_ARTIFACT_DIR" -maxdepth 1 -type f -name '*-prompt.md' | sort)
            HANDOFF_PROMPT_COUNT="${#HANDOFF_PROMPT_PATHS[@]}"
            mkdir -p "$REPORT_DIR/.agent-handoff"
            cp "${HANDOFF_PROMPT_PATHS[@]}" "$REPORT_DIR/.agent-handoff/"
            HANDOFF_PROMPTS_PACKAGED="true"

            if [ "$HANDOFF_PROMPT_COUNT" = "1" ]; then
              HANDOFF_PROMPT_PATH="${HANDOFF_PROMPT_PATHS[0]}"
            fi
          fi

          echo "Workspace diagnostic tree before artifact upload:"
          echo "Current directory: $(pwd)"
          echo "Contents of $REPORT_DIR:"
          find "$REPORT_DIR" -maxdepth 3 -print | sort
          if [ -d "$HANDOFF_ARTIFACT_DIR" ]; then
            echo "Contents of $HANDOFF_ARTIFACT_DIR:"
            find "$HANDOFF_ARTIFACT_DIR" -maxdepth 2 -print | sort
          else
            echo "$HANDOFF_ARTIFACT_DIR does not exist."
          fi

          {
            echo "### Ready Task Dispatch Discovery"
            echo
            echo "- Reporter exit code: \`$REPORT_EXIT_CODE\`"
            echo "- Mode: \`$MODE_DESCRIPTION\`"
            echo "- Claim mode enabled: \`$CLAIM_ENABLED\`"
            echo "- Handoff prompt artifacts found: \`$HANDOFF_PROMPTS_FOUND\`"
            echo "- Handoff prompt artifacts packaged: \`$HANDOFF_PROMPTS_PACKAGED\`"
            echo "- Handoff prompt artifact count: \`$HANDOFF_PROMPT_COUNT\`"
            echo "- Handoff prompt path: \`${HANDOFF_PROMPT_PATH:-none}\`"
            echo "- Codex Cloud auto-start requested: \`$START_CODEX_CLOUD\`"
            echo "- Local Codex invoked: no"
            echo
            echo "#### Artifact staging diagnostics"
            echo
            echo "- Current directory: \`$(pwd)\`"
            echo "- Report staging directory: \`$REPORT_DIR\`"
            echo "- Handoff artifact directory: \`$HANDOFF_ARTIFACT_DIR\`"
            echo
            cat "$REPORT_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "report_path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "report_exit_code=$REPORT_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "handoff_prompts_found=$HANDOFF_PROMPTS_FOUND" >> "$GITHUB_OUTPUT"
          echo "handoff_prompts_packaged=$HANDOFF_PROMPTS_PACKAGED" >> "$GITHUB_OUTPUT"
          echo "handoff_prompt_count=$HANDOFF_PROMPT_COUNT" >> "$GITHUB_OUTPUT"
          echo "handoff_prompt_path=$HANDOFF_PROMPT_PATH" >> "$GITHUB_OUTPUT"

          if [ "$REPORT_EXIT_CODE" -ne 0 ] && [ "$REPORT_EXIT_CODE" -ne 2 ]; then
            echo "Reporter failed unexpectedly with exit code $REPORT_EXIT_CODE." >&2
            exit "$REPORT_EXIT_CODE"
          fi

      - name: "Prepare Codex Cloud trigger"
        id: codex_cloud_prepare
        if: ${{ inputs.start_codex_cloud == true || inputs.start_codex_cloud == 'true' }}
        env:
          CLAIM_MODE: ${{ inputs.claim }}
          REPORT_EXIT_CODE: ${{ steps.dispatch.outputs.report_exit_code }}
          HANDOFF_PROMPT_COUNT: ${{ steps.dispatch.outputs.handoff_prompt_count }}
          HANDOFF_PROMPT_PATH: ${{ steps.dispatch.outputs.handoff_prompt_path }}
        run: |
          set -euo pipefail

          if [ "$CLAIM_MODE" != "true" ]; then
            echo "Codex Cloud auto-start requires claim=true so the task is explicitly claimed first." >&2
            exit 1
          fi

          if [ "$REPORT_EXIT_CODE" != "0" ]; then
            echo "Codex Cloud auto-start requested, but dispatcher did not complete successfully." >&2
            exit 1
          fi

          if [ "$HANDOFF_PROMPT_COUNT" != "1" ]; then
            echo "Codex Cloud auto-start requires exactly one generated handoff prompt; found $HANDOFF_PROMPT_COUNT." >&2
            exit 1
          fi

          if [ -z "$HANDOFF_PROMPT_PATH" ] || [ ! -f "$HANDOFF_PROMPT_PATH" ]; then
            echo "Codex Cloud auto-start requested, but the handoff prompt file is missing: ${HANDOFF_PROMPT_PATH:-<empty>}." >&2
            exit 1
          fi

          PROMPT_FILE_NAME="$(basename "$HANDOFF_PROMPT_PATH")"
          PROMPT_STEM="${PROMPT_FILE_NAME%-prompt.md}"
          ISSUE_NUMBER="${PROMPT_STEM##*-}"
          TASK_ID="${PROMPT_STEM%-${ISSUE_NUMBER}}"

          if ! printf '%s' "$ISSUE_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Could not parse issue number from handoff prompt file name: $PROMPT_FILE_NAME." >&2
            exit 1
          fi

          if [ -z "$TASK_ID" ] || [ "$TASK_ID" = "$PROMPT_STEM" ]; then
            echo "Could not parse Task-ID from handoff prompt file name: $PROMPT_FILE_NAME." >&2
            exit 1
          fi

          PROMPT_SIZE_BYTES="$(wc -c < "$HANDOFF_PROMPT_PATH" | tr -d ' ')"
          MAX_COMMENT_BYTES="60000"
          if [ "$PROMPT_SIZE_BYTES" -gt "$MAX_COMMENT_BYTES" ]; then
            echo "Generated prompt is $PROMPT_SIZE_BYTES bytes; refusing to post an oversized @codex trigger comment." >&2
            exit 1
          fi

          COMMENT_BODY_PATH="ready-dispatch-report/codex-cloud-trigger-comment.md"
          {
            echo "@codex implement the claimed task below. Create a branch, make the required code changes, run validation, and open a PR against develop. Do not merge the PR."
            echo
            echo "Use the full generated handoff prompt below as the implementation task prompt. This is not a PR review request."
            echo
            echo "Task-ID: $TASK_ID"
            echo "Task-Issue: #$ISSUE_NUMBER"
            echo
            echo "Safety constraints: follow the prompt exactly; do not merge PRs, approve PRs, close issues, delete branches, or delete worktrees."
            echo
            echo "---"
            echo
            cat "$HANDOFF_PROMPT_PATH"
          } > "$COMMENT_BODY_PATH"

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "comment_body_path=$COMMENT_BODY_PATH" >> "$GITHUB_OUTPUT"

      - name: "Trigger Codex Cloud task"
        if: ${{ inputs.start_codex_cloud == true || inputs.start_codex_cloud == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.codex_cloud_prepare.outputs.issue_number }}
          TASK_ID: ${{ steps.codex_cloud_prepare.outputs.task_id }}
          COMMENT_BODY_PATH: ${{ steps.codex_cloud_prepare.outputs.comment_body_path }}
        run: |
          set -euo pipefail

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file "$COMMENT_BODY_PATH"

          {
            echo
            echo "### Codex Cloud Auto-Start"
            echo
            echo "- Trigger mechanism: \`@codex\` issue comment"
            echo "- Task-ID: \`$TASK_ID\`"
            echo "- Task-Issue: \`#$ISSUE_NUMBER\`"
            echo "- Handoff prompt comment posted: yes"
            echo "- Required repository setup: Codex Cloud GitHub integration enabled for this repository"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Upload dispatcher report"
        uses: actions/upload-artifact@v4
        with:
          name: ready-task-dispatch-report
          path: ready-dispatch-report/**
          include-hidden-files: true
          if-no-files-found: error
