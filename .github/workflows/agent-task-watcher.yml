name: "Agent Task Watcher"

"on":
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to process manually"
        required: true
        type: string

permissions:
  actions: write
  issues: write
  pull-requests: read
  contents: read

jobs:
  mark-task-merged:
    name: "Mark linked task issue as merged"
    runs-on: ubuntu-latest

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Resolve PR number"
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$EVENT_PR_NUMBER"
          else
            PR_NUMBER="$INPUT_PR_NUMBER"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: "Process merged task PR"
        id: mark_issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          OUTPUT="$(python scripts/agent_task_watcher.py --repo "$REPOSITORY" --pr-number "$PR_NUMBER")"
          printf '%s\n' "$OUTPUT"
          READY_COUNT="$(printf '%s\n' "$OUTPUT" | sed -nE 's/^.*; ([0-9]+) ready downstream update\(s\)\.$/\1/p' | tail -n 1)"
          echo "ready_count=${READY_COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: "Trigger ready task dispatch claim"
        if: steps.mark_issue.outputs.ready_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          READY_COUNT: ${{ steps.mark_issue.outputs.ready_count }}
          CODEX_CLOUD_AUTO_START: ${{ vars.CODEX_CLOUD_AUTO_START }}
        run: |
          set -euo pipefail

          CODEX_CLOUD_AUTO_START="${CODEX_CLOUD_AUTO_START:-false}"
          if [ "$CODEX_CLOUD_AUTO_START" != "true" ]; then
            CODEX_CLOUD_AUTO_START="false"
          fi

          echo "Triggering Ready Task Dispatch Discovery for $READY_COUNT newly ready dependent task(s)."
          gh workflow run ready-task-dispatch-discovery.yml \
            --repo "$REPOSITORY" \
            --ref develop \
            -f claim=true \
            -f start_codex_cloud="$CODEX_CLOUD_AUTO_START"
