name: "Review Task"
description: "Create a review-only task for an existing PR."
title: "[REVIEW] "
labels:
  - review-task
body:
  - type: input
    id: task_id
    attributes:
      label: "Task ID"
      description: "Example: RV-004"
      placeholder: "RV-004"
    validations:
      required: true

  - type: dropdown
    id: lane
    attributes:
      label: "Lane"
      options:
        - review
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: "Status"
      options:
        - blocked
        - ready
        - in-progress
        - in-review
        - needs-fix
        - merged
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: "Agent"
      options:
        - review-agent
    validations:
      required: true

  - type: input
    id: target_pr
    attributes:
      label: "Target PR"
      placeholder: "#123"
    validations:
      required: true

  - type: input
    id: target_task
    attributes:
      label: "Target implementation task"
      placeholder: "DN-004"
    validations:
      required: true

  - type: textarea
    id: review_scope
    attributes:
      label: "Review scope"
      description: "What the review-agent must verify."
    validations:
      required: true

  - type: textarea
    id: review_rules
    attributes:
      label: "Review rules"
      value: |
        The review-agent must not modify code.
        The review-agent must not create commits.
        The review-agent must not create branches.
        The review-agent must return one verdict: merge-ready, needs-fix, or blocked.
    validations:
      required: true

  - type: textarea
    id: required_final_report
    attributes:
      label: "Required final report"
      value: |
        - Verdict: merge-ready / needs-fix / blocked
        - Scope assessment
        - Files reviewed
        - Findings
        - Validation assessment
        - Remaining risks
    validations:
      required: true
